name: Contribution Matrix Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate decorative Matrix snake from synthetic cells
        run: python3 .github/scripts/generate-decorative-matrix-snake.py

      - name: Commit refreshed animation to develop
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contribution-matrix-snake.svg
          if git diff --cached --quiet; then
            echo "Animation is already up to date."
          else
            git commit -m "Refresh decorative contribution matrix animation"
            git push origin HEAD:develop
          fi
